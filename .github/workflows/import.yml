name: Import mailback files

on:
  schedule:
    - cron: "20 */2 * * *"      # every two hours
  workflow_dispatch: {}          # "Run workflow" button for manual runs

concurrency:
  group: import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: importer/requirements.txt
      - run: pip install -r importer/requirements.txt
      - name: Import files from the inbox
        working-directory: importer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAILBACK_ZIP_PASSWORD: ${{ secrets.MAILBACK_ZIP_PASSWORD }}
        run: python -m mfcrm.run --inbox
      - name: Logic checks
        working-directory: importer
        run: python -m tests.test_logic
